<!DOCTYPE html>
<html>
<head>
  <title>ReadyMe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">

    <!-- Logo -->
    <div class="logo">ReadyMe</div>

    <!-- Subtitle -->
    <p class="subtitle">Virtual Try-On</p>

    <!-- Main Card -->
    <div class="card">

      <p class="label">Active shopping page</p>

      <div class="status-row">
        <span class="field-label">Status</span>
        <span id="popup-status-badge" class="status-pill" data-status="loading">Loading</span>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <span class="field-label">Product</span>
          <span id="popup-product-value" class="field-value">Reading current tab…</span>
        </div>
        <div class="info-item">
          <span class="field-label">Site</span>
          <span id="popup-site-value" class="field-value">—</span>
        </div>
        <div class="info-item">
          <span class="field-label">Category</span>
          <span id="popup-category-value" class="field-value">—</span>
        </div>
        <div class="info-item">
          <span class="field-label">Sizes</span>
          <span id="popup-size-value" class="field-value">0</span>
        </div>
        <div class="info-item">
          <span class="field-label">Backend</span>
          <span id="popup-backend-value" class="field-value">Checking…</span>
        </div>
        <div class="info-item">
          <span class="field-label">Warnings</span>
          <span id="popup-warning-value" class="field-value">—</span>
        </div>
      </div>

      <button id="scan" class="cta-btn">
        <span>SCAN FIT</span>
      </button>

      <div id="debug-panel" class="debug-panel">
        <p class="debug-title">Last Run</p>
        <div id="debug-status" class="debug-status">No extraction run yet.</div>
      </div>

    </div>

    <!-- Footer -->
    <p class="footer">Luxury Virtual Fashion</p>

  </div>

  <script src="popup.js"></script>
</body>
</html>

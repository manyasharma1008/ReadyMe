<!DOCTYPE html>
<html>
<head>
  <title>ReadyMe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">

    <!-- Logo -->
    <div class="logo">ReadyMe</div>

    <!-- Subtitle -->
    <p class="subtitle">Virtual Try-On</p>

    <!-- Main Card hai yh madarchod-->
    <div class="card">

      <p class="label">Scan current outfit</p>

      <button id="scan" class="cta-btn">
        <span>SCAN FIT</span>
      </button>

      <div id="debug-panel" class="debug-panel">
        <p class="debug-title">Last Run</p>
        <div id="debug-status" class="debug-status">No extraction run yet.</div>
      </div>

    </div>

    <!-- Footer -->
    <p class="footer">Luxury Virtual Fashion</p>

  </div>

  <script src="popup.js"></script>
</body>
</html>
